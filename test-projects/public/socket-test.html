<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO 测试工具</title>
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; padding: 20px; }
    h1 { font-size: 20px; margin-bottom: 16px; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
    .card-title { font-size: 14px; font-weight: 600; color: #666; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .row:last-child { margin-bottom: 0; }
    label { font-size: 13px; color: #666; min-width: 60px; }
    input, select, textarea { font-family: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid #d0d0d0; border-radius: 4px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #4A90D9; }
    input[type="text"], input[type="number"] { flex: 1; }
    textarea { width: 100%; min-height: 60px; resize: vertical; font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; }
    button { font-size: 13px; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; transition: background 0.15s; }
    .btn-primary { background: #4A90D9; color: #fff; }
    .btn-primary:hover { background: #3A7BC8; }
    .btn-primary:disabled { background: #b0b0b0; cursor: not-allowed; }
    .btn-danger { background: #E53935; color: #fff; }
    .btn-danger:hover { background: #C62828; }
    .btn-danger:disabled { background: #b0b0b0; cursor: not-allowed; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .btn-secondary:hover { background: #d0d0d0; }
    .btn-sm { font-size: 12px; padding: 4px 10px; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
    .status-dot.connected { background: #4CAF50; }
    .status-dot.connecting { background: #FF9800; animation: pulse 1s infinite; }
    .status-dot.error { background: #E53935; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .presets { display: flex; gap: 6px; flex-wrap: wrap; }
    .preset-btn { font-size: 11px; padding: 3px 8px; background: #f0f0f0; border: 1px solid #d0d0d0; border-radius: 3px; cursor: pointer; }
    .preset-btn:hover { background: #e0e0e0; }
    #log { background: #1e1e1e; color: #d4d4d4; font-family: 'SF Mono', Monaco, Consolas, monospace; font-size: 12px; padding: 12px; border-radius: 4px; min-height: 300px; max-height: 500px; overflow-y: auto; line-height: 1.6; }
    .log-entry { padding: 2px 0; border-bottom: 1px solid #333; }
    .log-time { color: #888; }
    .log-send { color: #6AB0F3; }
    .log-recv { color: #98C379; }
    .log-error { color: #E06C75; }
    .log-info { color: #E5C07B; }
    .log-system { color: #888; font-style: italic; }
    .clear-btn { float: right; background: none; border: none; color: #888; cursor: pointer; font-size: 12px; }
    .clear-btn:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Socket.IO 测试工具</h1>

    <!-- 连接设置 -->
    <div class="card">
      <div class="card-title">连接设置</div>
      <div class="row">
        <label>服务器</label>
        <input type="text" id="serverUrl" value="http://localhost:8787">
      </div>
      <div class="row">
        <label>命名空间</label>
        <select id="namespace">
          <option value="/speech">/speech（语音识别）</option>
          <option value="/push">/push（推送消息）</option>
        </select>
      </div>
      <div class="row">
        <label>Token</label>
        <input type="text" id="token" placeholder="留空则无认证连接">
        <button class="btn-secondary btn-sm" onclick="clearToken()">清除</button>
      </div>
      <div class="row">
        <label></label>
        <div class="presets">
          <button class="preset-btn" onclick="setToken('sk-dev-key-001')">sk-dev-key-001</button>
          <button class="preset-btn" onclick="setToken('sk-test-invalid')">无效 token</button>
          <button class="preset-btn" onclick="setToken('eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ0ZXN0IiwidHlwZSI6InVzZXIiLCJyb2xlIjoiYWRtaW4ifQ.test')">伪造 JWT</button>
        </div>
      </div>
    </div>

    <!-- 连接控制 -->
    <div class="card">
      <div class="card-title">连接控制</div>
      <div class="row">
        <button class="btn-primary" id="connectBtn" onclick="connect()">连接</button>
        <button class="btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">未连接</span>
        </div>
      </div>
    </div>

    <!-- 消息发送 -->
    <div class="card">
      <div class="card-title">发送消息</div>
      <div class="row">
        <label>事件</label>
        <select id="eventName">
          <option value="config">config</option>
          <option value="audio">audio</option>
          <option value="stop">stop</option>
          <option value="subscribe">subscribe</option>
          <option value="unsubscribe">unsubscribe</option>
          <option value="custom">自定义...</option>
        </select>
        <input type="text" id="customEvent" placeholder="自定义事件名" style="display:none" disabled>
      </div>
      <div class="row">
        <label>Payload</label>
      </div>
      <textarea id="payload">{"model": "whisper-tiny"}</textarea>
      <div class="row" style="margin-top: 8px">
        <button class="btn-primary" id="sendBtn" onclick="sendMessage()" disabled>发送</button>
        <button class="btn-secondary" onclick="clearPayload()">清空</button>
      </div>
    </div>

    <!-- 事件日志 -->
    <div class="card">
      <div class="card-title">
        事件日志
        <button class="clear-btn" onclick="clearLog()">清空</button>
      </div>
      <div id="log"></div>
    </div>
  </div>

  <script>
    let socket = null
    let eventCount = 0

    const $ = id => document.getElementById(id)

    // --- Token ---
    function setToken(val) { $('token').value = val }
    function clearToken() { $('token').value = '' }

    // --- Custom event name ---
    $('eventName').addEventListener('change', function() {
      const isCustom = this.value === 'custom'
      $('customEvent').style.display = isCustom ? '' : 'none'
      $('customEvent').disabled = !isCustom
    })

    // --- Payload presets ---
    $('eventName').addEventListener('change', function() {
      const presets = {
        config: '{\n  "model": "whisper-tiny"\n}',
        audio: '{\n  "data": [0.1, 0.2, 0.3]\n}',
        stop: '',
        subscribe: '{\n  "topic": "test"\n}',
        unsubscribe: '{\n  "topic": "test"\n}',
      }
      if (this.value !== 'custom') {
        $('payload').value = presets[this.value] || ''
      }
    })

    function clearPayload() { $('payload').value = '' }

    // --- Logging ---
    function log(type, msg) {
      const now = new Date()
      const time = now.toLocaleTimeString('zh-CN', { hour12: false })
      const entry = document.createElement('div')
      entry.className = 'log-entry'
      entry.innerHTML = `<span class="log-time">${time}</span> <span class="log-${type}">${msg}</span>`
      $('log').appendChild(entry)
      $('log').scrollTop = $('log').scrollHeight
    }

    function clearLog() { $('log').innerHTML = '' }

    // --- Status ---
    function setStatus(state, text) {
      const dot = $('statusDot')
      dot.className = 'status-dot' + (state ? ' ' + state : '')
      $('statusText').textContent = text
    }

    // --- Connect ---
    function connect() {
      if (socket?.connected) return

      const url = $('serverUrl').value.trim()
      const ns = $('namespace').value
      const token = $('token').value.trim()

      if (!url) { log('error', '请输入服务器地址'); return }

      setStatus('connecting', '连接中...')
      log('info', `正在连接 ${url}${ns}...`)
      if (token) log('info', `Token: ${token.substring(0, 20)}${token.length > 20 ? '...' : ''}`)

      const opts = { transports: ['websocket'], reconnection: false }
      if (token) opts.auth = { token }

      socket = io(`${url}${ns}`, opts)

      socket.on('connect', () => {
        setStatus('connected', `已连接 (${socket.id})`)
        log('info', `连接成功: ${socket.id}`)
        updateButtons(true)
      })

      socket.on('connect_error', (err) => {
        setStatus('error', `连接失败: ${err.message}`)
        log('error', `连接失败: ${err.message}`)
        updateButtons(false)
      })

      socket.on('disconnect', (reason) => {
        setStatus('', '已断开')
        log('info', `连接断开: ${reason}`)
        updateButtons(false)
      })

      // 监听常见事件
      const listenEvents = ['ready', 'config_ok', 'result', 'stopped', 'error', 'subscribed', 'unsubscribed', 'message']
      listenEvents.forEach(evt => {
        socket.on(evt, (data) => {
          log('recv', `<b>${evt}</b> ${JSON.stringify(data)}`)
        })
      })
    }

    // --- Disconnect ---
    function disconnect() {
      if (socket) {
        socket.disconnect()
        socket = null
      }
      setStatus('', '已断开')
      updateButtons(false)
    }

    // --- Send ---
    function sendMessage() {
      if (!socket?.connected) { log('error', '未连接'); return }

      let eventName = $('eventName').value
      if (eventName === 'custom') {
        eventName = $('customEvent').value.trim()
        if (!eventName) { log('error', '请输入事件名'); return }
      }

      const payloadStr = $('payload').value.trim()
      let payload = undefined
      if (payloadStr) {
        try { payload = JSON.parse(payloadStr) }
        catch (e) { log('error', `JSON 解析失败: ${e.message}`); return }
      }

      socket.emit(eventName, payload)
      log('send', `<b>${eventName}</b> ${payloadStr || '(无 payload)'}`)
    }

    // --- Button state ---
    function updateButtons(connected) {
      $('connectBtn').disabled = connected
      $('disconnectBtn').disabled = !connected
      $('sendBtn').disabled = !connected
    }

    // --- Keyboard shortcut ---
    $('payload').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault()
        sendMessage()
      }
    })
  </script>
</body>
</html>
