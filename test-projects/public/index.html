<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试工程 - Open Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }
    h1 { font-size: 28px; color: #1a1a1a; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 900px; width: 100%; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 24px; text-decoration: none; color: inherit; transition: box-shadow 0.2s, transform 0.15s; display: flex; flex-direction: column; }
    .card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .card-icon { font-size: 32px; margin-bottom: 12px; }
    .card-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: #666; line-height: 1.5; flex: 1; }
    .card-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 3px; margin-top: 12px; align-self: flex-start; }
    .tag-stable { background: #e8f5e9; color: #2e7d32; }
    .tag-new { background: #e3f2fd; color: #1565c0; }
    .tag-wip { background: #fff3e0; color: #e65100; }
    footer { margin-top: 60px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <h1>Open Chat 测试工程</h1>
  <p class="subtitle">测试页面与演示集合</p>

  <div class="grid">
    <a class="card" href="socket-test.html">
      <div class="card-icon">🔌</div>
      <div class="card-title">Socket.IO 测试</div>
      <div class="card-desc">测试 WebSocket 连接、认证验证、消息收发。支持切换命名空间、手动输入 Token、实时事件日志。</div>
      <span class="card-tag tag-new">认证测试</span>
    </a>

    <a class="card" href="embed-integration.html">
      <div class="card-icon">💬</div>
      <div class="card-title">嵌入式对话集成</div>
      <div class="card-desc">模拟第三方网站集成 Open Chat 嵌入式对话组件。配置 API Key 后加载 embed.min.js，测试浮动按钮、窗口拖拽、对话功能。</div>
      <span class="card-tag tag-stable">稳定</span>
    </a>
  </div>

  <footer>Open Chat Test Projects</footer>
</body>
</html>
